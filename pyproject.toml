[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "med9tool"
version = "0.1.7"
description = "MED9.1/MED9.5 ECU editor for MPC5xx (PowerPC big-endian) VAG ECUs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
med9tool = "med9tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["med9tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
